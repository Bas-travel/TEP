      operationId: presignUpload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contentType, purpose]
              properties:
                contentType: { type: string }
                purpose: { type: string, enum: [listing_image, post_image, avatar] }
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  uploadUrl: { type: string, format: uri }
                  objectKey: { type: string }

  /devices/push-tokens:
    post:
      tags: [Devices]
      summary: Register FCM token
      operationId: registerPushToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, platform]
              properties:
                token: { type: string }
                platform: { type: string, enum: [ios, android] }
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '204':
          description: Registered

  /webhooks/payments/{provider}:
    post:
      tags: [Webhooks]
      security: []
      summary: Payment provider webhook (signature verified)
      operationId: paymentWebhook
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string }
        - name: X-Signature
          in: header
          required: true
          description: HMAC signature of the raw body, verified per provider before processing
          schema: { type: string }
      responses:
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: Acknowledged

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ListingId:
      name: listingId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    BookingId:
      name: bookingId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    PostId:
      name: postId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      schema: { type: string, maxLength: 64 }

  responses:
    Problem:
      description: Error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing, expired or invalid access token (code AUTH_UNAUTHENTICATED)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PaymentRequired:
      description: Insufficient wallet balance or payment required (code WALLET_INSUFFICIENT)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Authenticated but not allowed (code AUTH_FORBIDDEN)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource not found or not owned by caller (code NOT_FOUND)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationFailed:
      description: Validation error; see errors[] (code VALIDATION_FAILED)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Rate limited; see Retry-After header (code RATE_LIMITED)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Problem:
      type: object
      required: [title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string, description: 'Stable machine-readable code, e.g. VALIDATION_FAILED' }
        requestId: { type: string }
        errors:
          type: array
          description: Field-level validation errors
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }

    Health:
      type: object
      properties:
        status: { type: string, enum: [ok, degraded] }
        version: { type: string }
        checks:
          type: object
          additionalProperties: { type: string, enum: [ok, down, disabled] }

    AuthTokens:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer }

    RegisterRequest:
      type: object
      required: [email, password, firstName, lastName]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        phone: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        gender: { type: string }
        dateOfBirth: { type: string, format: date }
        nationality: { type: string }
        language: { type: string }
        budgetLevel: { type: string, enum: [budget, mid, luxury] }
        travelStyles: { type: array, items: { type: string } }
        favoriteDestination: { type: string }
        travelWith: { type: string }

    UserProfile:
      description: Profile as returned by GET /me. Never contains password material.
      type: object
      properties:
        id: { type: integer, format: int64 }
        level: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        gender: { type: string }
        dateOfBirth: { type: string, format: date }
        nationality: { type: string }
        language: { type: string }
        budgetLevel: { type: string, enum: [budget, mid, luxury] }
        travelStyles: { type: array, items: { type: string } }
        favoriteDestination: { type: string }
        travelWith: { type: string }
        avatarUrl: { type: string, format: uri }

    UserSettings:
      type: object
      properties:
        language: { type: string }
        currency: { type: string }
        theme: { type: string, enum: [light, dark, system] }
        notifications:
          type: object
          properties:
            push: { type: boolean }
            email: { type: boolean }
            trip: { type: boolean }
            promo: { type: boolean }

    Destination:
      type: object
      properties:
        id: { type: integer, format: int64 }
        slug: { type: string }
        name: { type: string }
        subtitle: { type: string }
        gradientCss: { type: string }

    ListingType:
      type: string
      enum: [hotel, restaurant, flight, attraction, trip]

    ListingSummary:
      type: object
      properties:
        id: { type: integer, format: int64 }
        type: { $ref: '#/components/schemas/ListingType' }
        name: { type: string }
        location: { type: string }
        rating: { type: number }
        reviewCount: { type: integer }
        priceFrom: { type: number }
        imageUrl: { type: string, format: uri, description: Card thumbnail (storage base URL + hero_image_key) }

    ListingDetail:
      allOf:
        - $ref: '#/components/schemas/ListingSummary'
        - type: object
          properties:
            description: { type: string }
            amenities: { type: array, items: { type: string } }
            mapQuery: { type: string }
            imageUrl: { type: string, format: uri }

    ListingList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ListingSummary'
        nextCursor: { type: string }

    CreateBookingRequest:
      type: object
      required: [lines]
      properties:
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [listingId, quantity]
            properties:
              listingId: { type: integer, format: int64 }
              quantity: { type: integer, default: 1 }
        couponCode: { type: string }
        tripPackage:
          type: object
          description: AI trip booking without listing ID
          properties:
            title: { type: string }
            subtitle: { type: string }
            price: { type: number }

    BookingSummary:
      type: object
      properties:
        id: { type: integer, format: int64 }
        bookingNumber: { type: string }
        type: { $ref: '#/components/schemas/ListingType' }
        title: { type: string }
        subtitle: { type: string }
        amount: { type: number }
        method: { type: string }
        date: { type: string, format: date-time }
        status: { type: string, enum: [pending_payment, confirmed, completed, cancelled] }

    BookingDetail:
      allOf:
        - $ref: '#/components/schemas/BookingSummary'
        - type: object
          properties:
            subtotal: { type: number }
            serviceFee: { type: number }
            cancelReason: { type: string }
            refundAmount: { type: number }

    PaymentIntent:
      type: object
      properties:
        id: { type: string }
        status: { type: string, enum: [pending, succeeded, failed] }
        method: { type: string }
        amount: { type: number }
        promptPayQrUrl: { type: string, format: uri }
        clientSecret: { type: string }

    Wallet:
      type: object
      properties:
        balance: { type: number }
        currency: { type: string }
        transactions:
          type: array
          items:
            type: object
            properties:
              id: { type: integer, format: int64 }
              direction: { type: string, enum: [in, out] }
              label: { type: string }
              amount: { type: number }
              createdAt: { type: string, format: date-time }

    ItineraryRequest:
      type: object
      required: [destination, days, budget]
      properties:
        destination: { type: string }
        days: { type: integer, minimum: 1, maximum: 14 }
        budget: { type: number }
        styles: { type: array, items: { type: string } }
        travelers: { type: integer, minimum: 1 }

    ItineraryJob:
      type: object
      properties:
        jobId: { type: string }
        status: { type: string, enum: [pending, completed, failed] }
        degraded: { type: boolean, description: true if template fallback used }
        result:
          $ref: '#/components/schemas/ItineraryResult'

    ItineraryResult:
      type: object
      properties:
        days:
          type: array
          items:
            type: object
            properties:
              title: { type: string }
              items:
                type: array
                items:
                  type: object
                  properties:
                    time: { type: string }
                    text: { type: string }
                    place: { type: string }
        budgetBreakdown:
          type: array
          items:
            type: object
            properties:
              label: { type: string }
              value: { type: number }

    SavedTripInput:
      type: object
      properties:
        destination: { type: string }
        days: { type: integer }
        travelers: { type: integer }
        budget: { type: number }
        itinerary: { $ref: '#/components/schemas/ItineraryResult' }
        source: { type: string, enum: [ai, community, manual] }

    SavedTrip:
      allOf:
        - $ref: '#/components/schemas/SavedTripInput'
        - type: object
          properties:
            id: { type: integer, format: int64 }

    Review:
      type: object
      properties:
        id: { type: integer, format: int64 }
        itemName: { type: string }
        itemType: { $ref: '#/components/schemas/ListingType' }
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string }
        createdAt: { type: string, format: date-time }

    CreateReviewRequest:
      type: object
      required: [listingId, rating, comment]
      properties:
        listingId: { type: integer, format: int64 }
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, maxLength: 2000 }

    UserCoupon:
      type: object
      properties:
        id: { type: integer, format: int64 }
        code: { type: string }
        title: { type: string }
        detail: { type: string }
        minSpend: { type: number }
        maxDiscount: { type: number }
        expiry: { type: string, format: date }
        status: { type: string, enum: [available, used, expired] }

    CouponApplyResult:
      type: object
      properties:
        valid: { type: boolean }
        discount: { type: number }
        message: { type: string }

    Notification:
      type: object
      properties:
        id: { type: integer, format: int64 }
        type: { type: string }
        title: { type: string }
        message: { type: string }
        read: { type: boolean }
        createdAt: { type: string, format: date-time }

    Faq:
      type: object
      properties:
        id: { type: integer }
        question: { type: string }
        answer: { type: string }

    SupportTicket:
      type: object
      properties:
        id: { type: integer, format: int64 }
        subject: { type: string }
        message: { type: string }
        createdAt: { type: string, format: date-time }

    Post:
      type: object
      properties:
        id: { type: integer, format: int64 }
        authorId: { type: string }
        type: { type: string, enum: [story, tip, question, trip] }
        destination: { type: string }
        groupId: { type: integer, format: int64, nullable: true }
        text: { type: string }
        likeCount: { type: integer }
        hasImage: { type: boolean }
        sharedTrip:
          type: object
          nullable: true
          properties:
            days: { type: integer }
            budget: { type: number }
            styles: { type: array, items: { type: string } }
        createdAt: { type: string, format: date-time }

    PostDetail:
      allOf:
        - $ref: '#/components/schemas/Post'
        - type: object
          properties:
            comments:
              type: array
              items:
                $ref: '#/components/schemas/Comment'

    PostList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Post'
        nextCursor: { type: string }

    CreatePostRequest:
      type: object
      required: [type, text]
      properties:
        type: { type: string, enum: [story, tip, question] }
        destination: { type: string }
        groupId: { type: integer, format: int64 }
        text: { type: string, minLength: 10, maxLength: 500 }
        imageObjectKey: { type: string }

    Comment:
      type: object
      properties:
        id: { type: integer, format: int64 }
        authorId: { type: string }
        text: { type: string }
        likeCount: { type: integer }
        isBestAnswer: { type: boolean }
        createdAt: { type: string, format: date-time }

    Group:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        description: { type: string }
        destination: { type: string, nullable: true }
        memberCount: { type: integer }
        gradientCss: { type: string }

    GroupDetail:
      allOf:
        - $ref: '#/components/schemas/Group'
        - type: object
          properties:
            rules: { type: array, items: { type: string } }
            joined: { type: boolean }

    MemberProfile:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        level: { type: string }
        bio: { type: string }
        followerCount: { type: integer }
        following: { type: boolean }
