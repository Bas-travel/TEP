openapi: 3.0.3
info:
  title: TEP Travel API
  version: 0.1.0
  description: |
    Sabai jai Travel / TEP — backend contract (Go; net/http in Sprint 1, see ADR-004).
    DEV may use mock adapters; BETA/PROD use MySQL + Redis + object storage.
servers:
  - url: https://api.beta.example.com/v1
    description: Beta
  - url: https://api.example.com/v1
    description: Production
  - url: http://localhost:8080/v1
    description: Local DEV

tags:
  - name: Auth
  - name: Profile
  - name: Catalog
  - name: Bookings
  - name: Payments
  - name: Wallet
  - name: AI Planner
  - name: Trips
  - name: Reviews
  - name: Coupons
  - name: Notifications
  - name: Support
  - name: Community
  - name: Media
  - name: Devices
  - name: Webhooks
  - name: Partners
  - name: Partner portal
  - name: Admin portal
  - name: Staff portal
  - name: Health

security:
  - bearerAuth: []

paths:
  /health/live:
    get:
      tags: [Health]
      security: []
      summary: Liveness probe (served at server root, not under /v1)
      operationId: healthLive
      servers:
        - url: http://localhost:8080
      responses:
        '200':
          description: Process is up
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  /health/ready:
    get:
      tags: [Health]
      security: []
      summary: Readiness probe — checks MySQL and Redis (served at server root)
      operationId: healthReady
      servers:
        - url: http://localhost:8080
      responses:
        '200':
          description: All dependencies reachable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: A dependency is down
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  /auth/register:
    post:
      tags: [Auth]
      security: []
      summary: Register traveler (multi-step payload)
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '201':
          description: Registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '409':
          $ref: '#/components/responses/Problem'

  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Login with email and password
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '401':
          $ref: '#/components/responses/Problem'

  /auth/refresh:
    post:
      tags: [Auth]
      security: []
      summary: Rotate refresh token
      operationId: refreshTokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke current session (refresh token)
      operationId: logout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '204':
          description: Session revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/password:
    put:
      tags: [Auth]
      summary: Change password
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 8 }
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '204':
          description: Updated

  /me:
    get:
      tags: [Profile]
      summary: Current user profile
      operationId: getMe
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
    delete:
      tags: [Profile]
      summary: Delete account
      operationId: deleteAccount
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '204':
          description: Scheduled or completed deletion

  /me/settings:
    get:
      tags: [Profile]
      summary: App settings
      operationId: getSettings
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'
    patch:
      tags: [Profile]
      summary: Update settings
      operationId: patchSettings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSettings'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'

  /catalog/destinations:
    get:
      tags: [Catalog]
      summary: List featured destinations
      operationId: listDestinations
      security: []
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Destination'

  /catalog/listings:
    get:
      tags: [Catalog]
      summary: Search listings
      operationId: searchListings
      security: []
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/ListingType'
        - name: destinationId
          in: query
          schema: { type: integer, format: int64 }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 50 }
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingList'

  /catalog/listings/{listingId}:
    get:
      tags: [Catalog]
      summary: Listing detail
      operationId: getListing
      security: []
      parameters:
        - $ref: '#/components/parameters/ListingId'
      responses:
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingDetail'

  /bookings:
    get:
      tags: [Bookings]
      summary: My bookings
      operationId: listBookings
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [all, pending_payment, confirmed, completed, cancelled]
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/BookingSummary'
    post:
      tags: [Bookings]
      summary: Create booking draft
      operationId: createBooking
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookingRequest'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDetail'

  /bookings/{bookingId}:
    get:
      tags: [Bookings]
      summary: Booking detail
      operationId: getBooking
      parameters:
        - $ref: '#/components/parameters/BookingId'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDetail'

  /bookings/{bookingId}/cancel:
    post:
      tags: [Bookings]
      summary: Cancel booking and refund wallet if applicable
      operationId: cancelBooking
      parameters:
        - $ref: '#/components/parameters/BookingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDetail'

  /payments/intents:
    post:
      tags: [Payments]
      summary: Start payment for booking
      operationId: createPaymentIntent
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bookingId, method]
              properties:
                bookingId: { type: integer, format: int64 }
                method:
                  type: string
                  enum: [promptpay, card, wallet]
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentIntent'

  /payments/intents/{intentId}:
    get:
      tags: [Payments]
      summary: Poll payment status
      operationId: getPaymentIntent
      parameters:
        - name: intentId
          in: path
          required: true
          schema: { type: string }
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentIntent'

  /wallet:
    get:
      tags: [Wallet]
      summary: Wallet balance and recent transactions
      operationId: getWallet
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'

  /wallet/top-ups:
    post:
      tags: [Wallet]
      summary: Top up wallet (PromptPay in prod; mock in DEV)
      operationId: topUpWallet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { type: number, minimum: 1 }
                method: { type: string, enum: [promptpay] }
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '202':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentIntent'

  /ai/itineraries:
    post:
      tags: [AI Planner]
      summary: Request itinerary generation (async)
      operationId: createItineraryJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItineraryRequest'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '202':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItineraryJob'

  /ai/itineraries/jobs/{jobId}:
    get:
      tags: [AI Planner]
      summary: Get itinerary job status/result
      operationId: getItineraryJob
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string }
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItineraryJob'

  /trips/saved:
    get:
      tags: [Trips]
      summary: List saved trips
      operationId: listSavedTrips
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SavedTrip'
    post:
      tags: [Trips]
      summary: Save trip (from AI or community copy)
      operationId: createSavedTrip
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavedTripInput'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedTrip'

  /trips/saved/{tripId}:
    get:
      tags: [Trips]
      summary: Saved trip detail
      operationId: getSavedTrip
      parameters:
        - name: tripId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedTrip'

  /reviews:
    get:
      tags: [Reviews]
      summary: My reviews
      operationId: listMyReviews
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Review'
    post:
      tags: [Reviews]
      summary: Submit review for listing
      operationId: createReview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReviewRequest'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'

  /coupons:
    get:
      tags: [Coupons]
      summary: My coupons
      operationId: listCoupons
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserCoupon'

  /coupons/{code}/apply:
    post:
      tags: [Coupons]
      summary: Mark coupon used / validate for checkout
      operationId: applyCoupon
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                bookingDraftTotal: { type: number }
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CouponApplyResult'

  /notifications:
    get:
      tags: [Notifications]
      summary: In-app notifications
      operationId: listNotifications
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Notification'

  /notifications/read-all:
    post:
      tags: [Notifications]
      summary: Mark all read
      operationId: markAllNotificationsRead
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '204':
          description: OK

  /notifications/{notificationId}/read:
    post:
      tags: [Notifications]
      summary: Mark one notification read
      operationId: markNotificationRead
      parameters:
        - name: notificationId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '204':
          description: OK

  /support/faqs:
    get:
      tags: [Support]
      summary: Static FAQ list
      operationId: listFaqs
      security: []
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Faq'

  /support/tickets:
    get:
      tags: [Support]
      summary: My support tickets
      operationId: listSupportTickets
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SupportTicket'
    post:
      tags: [Support]
      summary: Create support ticket
      operationId: createSupportTicket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject, message]
              properties:
                subject: { type: string, maxLength: 120 }
                message: { type: string, maxLength: 2000 }
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportTicket'

  /community/feed:
    get:
      tags: [Community]
      summary: Feed with filters
      operationId: getCommunityFeed
      parameters:
        - name: mode
          in: query
          schema: { type: string, enum: [all, following] }
        - name: destination
          in: query
          schema: { type: string }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostList'

  /community/posts:
    post:
      tags: [Community]
      summary: Create post
      operationId: createPost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePostRequest'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
