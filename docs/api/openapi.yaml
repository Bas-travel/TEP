              schema:
                type: object
                properties:
                  following: { type: boolean }

  /community/posts/{postId}/copy-trip:
    post:
      tags: [Community]
      summary: Copy shared trip from post to saved trips
      operationId: copyTripFromPost
      parameters:
        - $ref: '#/components/parameters/PostId'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
